<div class="stickersheet-controls">
  <h2>Controls</h2>
  <div class="corn-form--row">
    <button class="corn-button corn-button--xs" id="default-state" type="button">Default</button>
    <button class="corn-button corn-button--xs" id="error-state" type="button">Error</button>
    <button class="corn-button corn-button--xs" id="warning-state" type="button">Warning</button>
    <button class="corn-button corn-button--xs" id="success-state" type="button">Success</button>
    <button class="corn-button corn-button--xs" id="disable" type="button">Disable</button>
    <button class="corn-button corn-button--xs" id="enable" type="button">Enable</button>
  </div>
  <div>Current State: <span id="current-state">default</span></div>
  <script src="./src/stickersheet.js"></script>
</div>
